name: NajmCard Windows Core and Release
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main', 'ui/hadramout-layout-match']
  workflow_dispatch:
# A single run retains Core and Release in parallel on one SHA. Cancel stale
# workflow runs when the PR head changes instead of spending Windows minutes
# on obsolete intermediate commits.
concurrency:
  group: najimcardnew-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  RELEASE_VERSION: 1.0.0-rc.1
permissions:
  contents: read
jobs:
  windows-core:
    name: Windows Core
    env:
      NAJM_EXPECT_ARCH: x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build all projects including WPF
        run: dotnet build NajmCard.slnx --configuration Release
      - name: Validate vector UI and navigation contracts
        run: python -m unittest discover -s tests -p test_*.py -v
      - name: Inventory every source UI event binding
        run: python scripts/inventory-ui-actions.py out/ui-action-bindings.json
      - name: Execute Core tests
        run: dotnet test tests/NajmCard.Core.Tests/NajmCard.Core.Tests.csproj --configuration Release --no-restore
      - name: Test router identity, migration and interrupted batch recovery
        run: dotnet test tests/NajmCard.Delivery.Tests/NajmCard.Delivery.Tests.csproj --configuration Release --no-restore
      - name: Test real SQLite/DPAPI desktop persistence
        run: dotnet test tests/NajmCard.Desktop.Tests/NajmCard.Desktop.Tests.csproj --configuration Release --no-restore
      - name: Validate release PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Capture actual creator UI at 1260x730
        timeout-minutes: 8
        run: dotnet run --project tests/NajmCard.VisualSmoke/NajmCard.VisualSmoke.csproj --configuration Release -- out/creator-1260x730.png
      - name: Upload complete UI and DPI audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Release-ui-audit-core
          path: |
            out/*.png
            out/release-ui-audit.json
            out/ui-action-bindings.json
          if-no-files-found: error
      - name: Check out approved phase 2 for read benchmarks
        uses: actions/checkout@v4
        with:
          ref: bc26cedc2e60fbe2cbc778631c8b3cc6a2ad27f5
          path: .benchmark-baseline
          persist-credentials: false
      - name: Compare simulated RouterOS reads before and after
        shell: pwsh
        run: ./scripts/benchmark-router-reads.ps1 -Label core
      - name: Check out approved phase 3 for voucher benchmarks
        uses: actions/checkout@v4
        with:
          ref: 7f3b92b4656eb8fa14052b87cb493766b3fd1d6b
          path: .pipeline-baseline
          persist-credentials: false
      - name: Compare real WPF PDF before and after
        timeout-minutes: 25
        shell: pwsh
        run: ./scripts/benchmark-voucher-pipeline.ps1 -Label core -Mode Print
      - name: Compare durable voucher pipeline before and after
        timeout-minutes: 120
        shell: pwsh
        run: ./scripts/benchmark-voucher-pipeline.ps1 -Label core -Mode Pipeline
      - name: Upload voucher pipeline measurements
        uses: actions/upload-artifact@v4
        with:
          name: Voucher-pipeline-benchmarks-core
          path: out/voucher-*.jsonl
          if-no-files-found: error
      - name: Upload read performance measurements
        uses: actions/upload-artifact@v4
        with:
          name: Router-read-benchmarks-core
          path: out/router-reads-*.jsonl
          if-no-files-found: error
      - name: Upload creator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: NajmCard-creator-1260x730
          path: out/creator-1260x730.png
          if-no-files-found: error
      - name: Upload login screenshot
        uses: actions/upload-artifact@v4
        with:
          name: NajmCard-login-1260x730
          path: out/login-1260x730.png
          if-no-files-found: error
      - name: Upload dashboard screenshot
        uses: actions/upload-artifact@v4
        with:
          name: NajmCard-dashboard-1260x730
          path: out/dashboard-1260x730.png
          if-no-files-found: error
      - name: Upload settings and shortcut screenshot
        uses: actions/upload-artifact@v4
        with:
          name: NajmCard-settings-1260x730
          path: out/settings-1260x730.png
          if-no-files-found: error
      - name: Upload User Manager landing screenshot
        uses: actions/upload-artifact@v4
        with:
          name: NajmCard-usermanager-home-1260x730
          path: out/user-manager-home-1260x730.png
          if-no-files-found: error
      - name: Verify six User Manager subpage screenshots
        shell: pwsh
        run: |
          @('users','packages','sessions','search','reports','maintenance') | ForEach-Object {
            $path = "out/user-manager-$($_)-1260x730.png"
            if (!(Test-Path $path)) { throw "Missing actual WPF screenshot: $path" }
          }
      - name: Upload User Manager six subpages at 1260x730
        uses: actions/upload-artifact@v4
        with:
          name: NajmCard-usermanager-six-subpages-1260x730
          path: out/user-manager-*-1260x730.png
          if-no-files-found: error
  windows-release:
    name: Windows Release tests (${{ matrix.arch }})
    env:
      NAJM_EXPECT_ARCH: ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install native x86 SDK and test host
        if: matrix.arch == 'x86'
        shell: pwsh
        run: |
          $installScript=Join-Path $env:RUNNER_TEMP 'dotnet-install-x86.ps1'
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile $installScript
          $sdk=Join-Path $env:RUNNER_TEMP 'dotnet-x86'
          & $installScript -Channel 10.0 -Architecture x86 -InstallDir $sdk
          if ($LASTEXITCODE -ne 0) { throw 'x86 SDK installation failed' }
          $sdk | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "DOTNET_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DOTNET_ROOT_X86=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Restore and compile
        run: dotnet build NajmCard.slnx --configuration Release
      - name: Static UI layout checks
        run: python -m unittest discover -s tests -p test_*.py -v
      - name: Inventory every source UI event binding
        run: python scripts/inventory-ui-actions.py out/ui-${{ matrix.arch }}/ui-action-bindings.json
      - name: Tests before packaging
        run: dotnet test tests/NajmCard.Core.Tests/NajmCard.Core.Tests.csproj --configuration Release --no-restore
      - name: Batch recovery tests before packaging
        run: dotnet test tests/NajmCard.Delivery.Tests/NajmCard.Delivery.Tests.csproj --configuration Release --no-restore
      - name: Desktop persistence tests before packaging
        run: dotnet test tests/NajmCard.Desktop.Tests/NajmCard.Desktop.Tests.csproj --configuration Release --no-restore
      - name: Audit native WPF controls and DPI before benchmarks
        timeout-minutes: 8
        shell: pwsh
        run: |
          dotnet build tests/NajmCard.VisualSmoke/NajmCard.VisualSmoke.csproj -c Release -r win-${{ matrix.arch }} --self-contained true
          if ($LASTEXITCODE -ne 0) { throw 'Native WPF audit build failed' }
          & ./tests/NajmCard.VisualSmoke/bin/Release/net10.0-windows/win-${{ matrix.arch }}/NajmCard.VisualSmoke.exe out/ui-${{ matrix.arch }}/creator-1260x730.png
          if ($LASTEXITCODE -ne 0) { throw 'Native WPF audit failed' }
      - name: Upload architecture UI and DPI audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Release-ui-audit-${{ matrix.arch }}
          path: out/ui-${{ matrix.arch }}/
          if-no-files-found: error
      - name: Check out approved phase 2 for read benchmarks
        uses: actions/checkout@v4
        with:
          ref: bc26cedc2e60fbe2cbc778631c8b3cc6a2ad27f5
          path: .benchmark-baseline
          persist-credentials: false
      - name: Compare simulated RouterOS reads before packaging
        shell: pwsh
        run: ./scripts/benchmark-router-reads.ps1 -Label release-${{ matrix.arch }}
      - name: Check out approved phase 3 for voucher benchmarks
        uses: actions/checkout@v4
        with:
          ref: 7f3b92b4656eb8fa14052b87cb493766b3fd1d6b
          path: .pipeline-baseline
          persist-credentials: false
      - name: Compare real WPF PDF before and after
        timeout-minutes: 25
        shell: pwsh
        run: ./scripts/benchmark-voucher-pipeline.ps1 -Label release-${{ matrix.arch }} -Architecture ${{ matrix.arch }} -Mode Print
      - name: Compare durable voucher pipeline before and after
        timeout-minutes: 120
        shell: pwsh
        run: ./scripts/benchmark-voucher-pipeline.ps1 -Label release-${{ matrix.arch }} -Architecture ${{ matrix.arch }} -Mode Pipeline
      - name: Upload voucher pipeline measurements
        uses: actions/upload-artifact@v4
        with:
          name: Voucher-pipeline-benchmarks-${{ matrix.arch }}
          path: out/voucher-*.jsonl
          if-no-files-found: error
      - name: Upload read performance measurements
        uses: actions/upload-artifact@v4
        with:
          name: Router-read-benchmarks-${{ matrix.arch }}
          path: out/router-reads-*.jsonl
          if-no-files-found: error
  windows-packages:
    name: Windows packages (${{ matrix.arch }})
    runs-on: windows-2022
    needs: [windows-core, windows-release]
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (!(Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and !(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup install failed' }
          }
      - name: Build verified Portable and Installer
        shell: pwsh
        run: ./scripts/package.ps1 -Arch ${{ matrix.arch }} -Version $env:RELEASE_VERSION
      - name: Check out approved previous release for actual upgrade
        uses: actions/checkout@v4
        with:
          ref: 8c8a6874b51504c8d0d8139007621c3d8ee149a7
          path: .release-baseline
          persist-credentials: false
      - name: Build previous 0.1.0 installer
        shell: pwsh
        run: ./.release-baseline/scripts/package.ps1 -Arch ${{ matrix.arch }} -Version 0.1.0
      - name: Prove actual launch, installation, upgrade, removal and preserved data
        timeout-minutes: 15
        shell: pwsh
        run: |
          dotnet build tests/NajmCard.VisualSmoke/NajmCard.VisualSmoke.csproj -c Release -r win-${{ matrix.arch }} --self-contained true
          if ($LASTEXITCODE -ne 0) { throw 'Package probe build failed' }
          ./scripts/test-package-lifecycle.ps1 -Arch ${{ matrix.arch }} -Version $env:RELEASE_VERSION -BaselineInstaller .release-baseline/out/NajimCardNew-v0.1.0-${{ matrix.arch }}-Installer.exe -Probe tests/NajmCard.VisualSmoke/bin/Release/net10.0-windows/win-${{ matrix.arch }}/NajmCard.VisualSmoke.exe
      - name: Upload package acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Release-package-acceptance-${{ matrix.arch }}
          path: out/acceptance-${{ matrix.arch }}/
          if-no-files-found: error
      - name: Include candidate changelog and acceptance checklist
        shell: pwsh
        run: |
          Copy-Item docs/CHANGELOG_RC.md out/CHANGELOG_RC.md
          Copy-Item docs/RELEASE_READINESS_STAGE6.md out/RELEASE_READINESS_STAGE6.md
          Copy-Item docs/UI_ACTION_ACCEPTANCE_STAGE6.md out/UI_ACTION_ACCEPTANCE_STAGE6.md
      - name: Upload both packages with SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: NajimCardNew-v${{ env.RELEASE_VERSION }}-${{ matrix.arch }}
          path: |
            out/NajimCardNew-v${{ env.RELEASE_VERSION }}-${{ matrix.arch }}-Portable.zip
            out/NajimCardNew-v${{ env.RELEASE_VERSION }}-${{ matrix.arch }}-Installer.exe
            out/SHA256SUMS-${{ matrix.arch }}.txt
            out/CHANGELOG_RC.md
            out/RELEASE_READINESS_STAGE6.md
            out/UI_ACTION_ACCEPTANCE_STAGE6.md
          if-no-files-found: error
