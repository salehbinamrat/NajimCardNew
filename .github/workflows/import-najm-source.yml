name: Import verified NajmCard independent source
on:
  push:
    branches: ['feature/port-hadramout-functional-parity']
    paths:
      - 'NajmCard_CSharp_NET10_Independent_Source_v0.1.0.zip'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/port-hadramout-functional-parity
      - name: Verify archive and extract source
        shell: bash
        run: |
          set -euo pipefail
          python scripts/import_initial_source.py NajmCard_CSharp_NET10_Independent_Source_v0.1.0.zip
      - name: Commit extracted C# source on branch only
        shell: bash
        run: |
          set -euo pipefail
          git add -- .github src tests scripts docs installer .gitignore global.json Directory.Build.props NajmCard.slnx
          git rm -- NajmCard_CSharp_NET10_Independent_Source_v0.1.0.zip
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(import): restore independent NajmCard C# snapshot'
            git push origin HEAD:feature/port-hadramout-functional-parity
          fi
